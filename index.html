<html>
    <head>
        <title>Hacklers</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <h1>THIS IS A PRANK!!! DO NOT TAKE THIS SERIOUSLY, NO DATA IS DOWNLOADED OR SOLD.</h1>
        <button onclick="Start()">Begin</button>
        <button onclick="location.replace('https://hacklers.github.io/cooked')">Cooked Version</button>
        <button onclick="closeWindows(); clearInterval(interval)">Quit</button>
        <script>
        function addWindow(text) {
            var hackedWindow = window.open("", "", "width=400,height=400")
            hackedWindow.document.writeln(text)
            setInterval(function() {
                hackedWindow.document.title = (Math.random() * 5000).toString()
            }, 1)
            
            var height = window.screen.availHeight
            var width = window.screen.availWidth
            
            setInterval(function() {
                hackedWindow.moveTo(Math.floor(Math.random() * (width - 400)), Math.floor(Math.random() * (height - 400)))
            }, 15)

            hackedWindow.addEventListener("beforeunload", stopClose, false)
            
            return hackedWindow
        }

        function stopClose() {
            const audio = new Audio("https://www.fesliyanstudios.com/play-mp3/387");
            audio.loop = true
            audio.play()
            alert("Think you can close me?!")
            addWindow("Think you can close me?!")
            addWindow("Think you can close me?!")
            addWindow("<img src='https://i.pinimg.com/736x/72/cf/8e/72cf8eeeaf310f363608fd30367ac635.jpg' width='100%' height='100%'>")
        }

        var windows = []
        var newWindows = []
        
        async function getIP() {
            var res = await fetch("https://api.ipify.org?format=json")
            var data = await res.json()
            return data.ip
        }
        
        function closeWindows() {
            windows.forEach((element) => {
                element.removeEventListener("beforeunload", stopClose, false)
                element.close()
            })
            newWindows.forEach((element) => {
                element.close()
            })
            location.reload()
        }

        var start = false
        var interval;
        
        function Start() {
            if (!start) {
                start = true
                
                windows.push(addWindow("HACKED HACKED HACKED HACKED HACKED HACKED HACKED HACKED HACKED HACKED HACKED HACKED HACKED HACKED HACKED HACKED HACKED HACKED HACKED HACKED HACKED HACKED HACKED HACKED HACKED HACKED HACKED HACKED HACKED HACKED HACKED HACKED HACKED HACKED HACKED HACKED HACKED HACKED HACKED HACKED HACKED HACKED HACKED HACKED"))
                navigator.getBattery().then((battery) => {
                    windows.push(addWindow(`Your battery is ${battery.charging ? "Charging" : "Not Charging"}`))
                })
                windows.push(addWindow(`Platform: ${navigator.platform}`))
                getIP().then((ip) => windows.push(addWindow(`IP: ${ip}`)))
                
                setInterval(function() {
                    windows.forEach((element) => {
                        element.focus()
                    })
                }, 1000)
                
                interval = setInterval(function() {
                    getIP().then((ip) => {
                        newWindows.push(window.open("https://hacklers.github.io/blank", ""))
                    })
                }, 2500)
            }
        }
        </script>
    </body>
</html>
